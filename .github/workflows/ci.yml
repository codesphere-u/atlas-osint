name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Type check
        run: mypy
      - name: Tests
        run: pytest -q --junitxml=pytest-report.xml
      - name: Entity-resolution benchmark (synthetic)
        run: python scripts/evaluate_entity_resolution.py > /dev/null
      - name: Source coverage document is up to date
        run: |
          python scripts/generate_source_coverage.py
          git diff --exit-code docs/source-coverage.md
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-test-report
          path: |
            pytest-report.xml
            docs/test-results/entity-resolution-metrics.json

  postgres-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: atlas
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U atlas" --health-interval 5s --health-retries 20
    env:
      ATLAS_DATABASE_URL: postgresql+psycopg://atlas:atlas@localhost:5432/atlas
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Apply migrations and check for model drift
        run: |
          atlas migrate
          alembic -c apps/api/atlas_api/migrations/alembic.ini check

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Bandit (SAST)
        run: bandit -q -c pyproject.toml -r shared engine modules integrations workers apps/api
      - name: pip-audit (dependency vulnerabilities)
        run: pip-audit --skip-editable
      - name: npm audit (production dependencies)
        working-directory: apps/web
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  docker:
    runs-on: ubuntu-latest
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v7
      - name: Build API image
        run: docker build -f docker/api.Dockerfile -t atlas-osint/api:ci .
      - name: Build web image
        run: docker build -f docker/web.Dockerfile -t atlas-osint/web:ci .
      - name: Deploy scripts pass shellcheck
        run: |
          shellcheck -x -S warning deploy/*.sh
          shellcheck -s sh deploy/backup-loop.sh
      - name: Generate a production .env with deploy/setup.sh
        run: ./deploy/setup.sh --domain localhost --admin-email ci-admin@example.org
      - name: Compose and Caddy configuration are valid
        run: |
          docker compose config -q
          docker run --rm -e ATLAS_DOMAIN=atlas.example.org -e "ATLAS_ALLOWED_IPS=192.0.2.0/24" \
            -v "$PWD/docker/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Start the production stack and verify it
        run: |
          docker tag atlas-osint/api:ci atlas-osint/api:latest
          docker tag atlas-osint/web:ci atlas-osint/web:latest
          docker compose up -d --no-build
          ./deploy/check.sh
          email=$(grep '^ATLAS_BOOTSTRAP_ADMIN_EMAIL=' .env | cut -d= -f2-)
          password=$(grep '^ATLAS_BOOTSTRAP_ADMIN_PASSWORD=' .env | cut -d= -f2-)
          code=$(curl -sk -o /dev/null -w '%{http_code}' https://localhost/api/v1/auth/login \
            -H 'Content-Type: application/json' -d "{\"email\":\"$email\",\"password\":\"$password\"}")
          test "$code" = 200 || { echo "login returned $code"; exit 1; }
      - name: Container logs on failure
        if: failure()
        run: docker compose logs --tail=80
