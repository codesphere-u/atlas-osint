name: Release images

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push API image
        run: |
          docker build -f docker/api.Dockerfile -t ghcr.io/${{ github.repository }}/api:${{ github.ref_name }} .
          docker push ghcr.io/${{ github.repository }}/api:${{ github.ref_name }}
      - name: Build and push web image
        run: |
          docker build -f docker/web.Dockerfile -t ghcr.io/${{ github.repository }}/web:${{ github.ref_name }} .
          docker push ghcr.io/${{ github.repository }}/web:${{ github.ref_name }}
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" --generate-notes --title "ATLAS OSINT ${{ github.ref_name }}"
