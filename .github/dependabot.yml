version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /apps/web
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    ignore:
      # eslint-config-next 15.x declares peer eslint ^7.23 || ^8 || ^9; ESLint 10 breaks `npm ci`.
      # Remove when the app moves to Next 16 (eslint-config-next 16 supports eslint >= 9).
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      # Tailwind 4 replaces the PostCSS plugin and the JS config format; needs a deliberate migration.
      - dependency-name: tailwindcss
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /docker
    schedule: { interval: weekly }
